apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

// 签名配置（通过 gradle -P 参数传入）
def ksFile      = project.findProperty("keystoreFile")  ?: ""
def ksAlias     = project.findProperty("keyAlias")      ?: ""
def ksKeyPwd    = project.findProperty("keyPassword")   ?: ""
def ksStorePwd  = project.findProperty("storePassword") ?: ""
def hasSigning  = ksFile && ksAlias && ksKeyPwd && ksStorePwd

android {
    namespace "com.openwrtmanager"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.openwrtmanager"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode (project.findProperty("versionCode") as Integer) ?: 1
        versionName project.findProperty("versionName") ?: "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile     file("debug.keystore")
            storePassword "android"
            keyAlias      "androiddebugkey"
            keyPassword   "android"
        }
        release {
            if (hasSigning) {
                storeFile     file(ksFile)
                storePassword ksStorePwd
                keyAlias      ksAlias
                keyPassword   ksKeyPwd
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig  hasSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled  true
            proguardFiles  getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            reset()
            enable       true
            universalApk (project.findProperty("universalApk") ?: "false").toBoolean()
            include      "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

react {
    hermesEnabled = true
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
