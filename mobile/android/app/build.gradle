apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

def ksFile     = project.findProperty("keystoreFile")  ?: ""
def ksAlias    = project.findProperty("keyAlias")      ?: ""
def ksKeyPwd   = project.findProperty("keyPassword")   ?: ""
def ksStorePwd = project.findProperty("storePassword") ?: ""
def hasSigning = ksFile && ksAlias && ksKeyPwd && ksStorePwd

// debug.keystore 路径（绝对路径，避免路径解析问题）
def debugKeystoreFile = rootProject.file("app/debug.keystore")

android {
    namespace "com.openwrtmanager"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.openwrtmanager"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode (project.findProperty("versionCode") as Integer) ?: 1
        versionName project.findProperty("versionName") ?: "1.0.0"
    }

    signingConfigs {
        debug {
            if (debugKeystoreFile.exists()) {
                storeFile     debugKeystoreFile
                storePassword "android"
                keyAlias      "androiddebugkey"
                keyPassword   "android"
            }
        }
        release {
            if (hasSigning) {
                storeFile     file(ksFile)
                storePassword ksStorePwd
                keyAlias      ksAlias
                keyPassword   ksKeyPwd
            }
        }
    }

    buildTypes {
        debug {
            signingConfig debugKeystoreFile.exists() ? signingConfigs.debug : null
        }
        release {
            // 没有 release keystore 时用 debug 签名（可安装，只是未正式签名）
            signingConfig hasSigning ? signingConfigs.release :
                          (debugKeystoreFile.exists() ? signingConfigs.debug : null)
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            reset()
            enable  true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

react {
    hermesEnabled = true
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
