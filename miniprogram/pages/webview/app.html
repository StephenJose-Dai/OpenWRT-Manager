<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OpenWrt Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#4f8ef7;--green:#22c55e;--red:#f85149;--yellow:#f59e0b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
input,button{outline:none;border:none;background:none;color:inherit;font:inherit}
button{cursor:pointer}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.page{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px}

/* Nav bar */
.nav{display:flex;gap:2px;background:var(--bg2);border-top:1px solid var(--border);padding:4px 8px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:11px;color:var(--muted);transition:.15s}
.nav-item.active{color:var(--blue);background:rgba(79,142,247,.1)}
.nav-item .icon{font-size:20px;line-height:1}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg3)}
.row:last-child{border-bottom:none}
.row-label{width:90px;font-size:13px;color:var(--muted);flex-shrink:0}
.row-val{flex:1;font-size:13px;color:var(--text);word-break:break-all}

/* Progress bar */
.progress{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:4px;transition:.3s}
.progress-fill.ok{background:var(--green)}
.progress-fill.warn{background:var(--yellow)}
.progress-fill.danger{background:var(--red)}

/* Buttons */
.btn{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-danger{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.3)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn:active{opacity:.7}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px}
.input:focus{border-color:var(--blue)}
.proto-switch{display:flex;background:var(--bg3);border-radius:8px;overflow:hidden;border:1px solid var(--border);width:fit-content}
.proto-btn{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
.proto-btn.active{background:var(--blue);color:#fff}
.ssl-card{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.toggle{width:44px;height:26px;background:var(--bg3);border-radius:13px;cursor:pointer;position:relative;transition:.25s;flex-shrink:0}
.toggle.on{background:var(--blue)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.25s}
.toggle.on::after{left:21px}

/* Banner */
.banner{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:8px}
.banner.error{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--red)}
.banner.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--yellow)}
.banner.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green)}

/* Device card */
.device-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:9px;background:rgba(79,142,247,.15);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--blue);flex-shrink:0}
.device-info{flex:1;min-width:0}
.device-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:monospace}
.kick-btn{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--red);border:1px solid rgba(248,81,73,.3);background:rgba(248,81,73,.08);cursor:pointer;flex-shrink:0}
.kick-btn:active{opacity:.6}

/* Firewall rule */
.rule-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.rule-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.rule-name{font-size:15px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{padding:3px 9px;border-radius:8px;font-size:11px;font-weight:500}
.badge.accept{background:rgba(34,197,94,.15);color:#4ade80}
.badge.drop{background:rgba(248,81,73,.15);color:#f87171}
.rule-meta{font-size:12px;color:var(--muted)}
.del-btn{font-size:12px;color:var(--red);cursor:pointer;padding:3px 8px;border-radius:6px;border:1px solid rgba(248,81,73,.3);background:rgba(248,81,73,.08)}

/* Speed */
.speed-row{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.speed-card{flex:1;padding:18px;text-align:center;border-right:1px solid var(--border)}
.speed-card:last-child{border-right:none}
.speed-label{font-size:12px;color:var(--muted)}
.speed-val{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.speed-val.rx{color:var(--blue)}
.speed-val.tx{color:var(--green)}

/* Search */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.search-input{flex:1;background:none;font-size:14px;color:var(--text)}
.search-input::placeholder{color:var(--muted)}

/* Tabs */
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);margin:-16px -16px 16px}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--muted)}
.empty{text-align:center;padding:40px;color:var(--muted)}

/* Charts - simple bars */
.chart{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.bars{display:flex;align-items:flex-end;height:64px;gap:3px;margin:12px 0 8px}
.bar-group{flex:1;display:flex;align-items:flex-end;gap:1px}
.bar{flex:1;border-radius:2px;min-height:2px;transition:.3s}
.legend{display:flex;gap:16px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <div id="content" class="page"></div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
// ═══════════════════════════════════════════════════
// OpenWrt ubus 客户端（完整版，支持HTTP/HTTPS/自签名）
// ═══════════════════════════════════════════════════
class OpenWrtClient {
  constructor(cfg) {
    this.host      = cfg.host
    this.port      = cfg.port || 80
    this.https     = cfg.https || false
    this.ignoreSSL = cfg.ignoreSSL || false
    this.username  = cfg.username || 'root'
    this.password  = cfg.password || ''
    this.timeout   = cfg.timeout || 15000
    this.session   = null
    this.sessionExpires = 0
    this._id       = 1
  }

  get baseUrl() {
    const proto = this.https ? 'https' : 'http'
    const isDefault = (this.port === 80 && !this.https) || (this.port === 443 && this.https)
    return `${proto}://${this.host}${isDefault ? '' : ':' + this.port}`
  }

  async _rpc(params) {
    const id   = this._id++
    const ctrl = new AbortController()
    const t    = setTimeout(() => ctrl.abort(), this.timeout)
    try {
      const r = await fetch(`${this.baseUrl}/ubus`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({jsonrpc:'2.0',id,method:'call',params}),
        signal: ctrl.signal
      })
      clearTimeout(t)
      if (!r.ok) throw new Error(`HTTP ${r.status}`)
      const d = await r.json()
      if (d.error) throw new Error(d.error.message||'RPC错误')
      if (!Array.isArray(d.result)) return d.result||{}
      const [code, result] = d.result
      if (code !== 0) throw Object.assign(new Error(_errMsg(code)), {code})
      return result||{}
    } catch(e) {
      clearTimeout(t)
      if (e.name==='AbortError') throw new Error('连接超时')
      throw e
    }
  }

  async login() {
    const NULL='00000000000000000000000000000000'
    const r = await this._rpc([NULL,'session','login',{username:this.username,password:this.password}])
    this.session = r.ubus_rpc_session
    this.sessionExpires = Date.now() + (r.expires||300)*1000
    return this.session
  }

  async ensureSession() {
    if (!this.session || Date.now() > this.sessionExpires-10000) await this.login()
  }

  async call(obj, method, params={}) {
    await this.ensureSession()
    return this._rpc([this.session, obj, method, params])
  }

  async getSystemInfo() {
    const [board, info] = await Promise.all([this.call('system','board'), this.call('system','info')])
    return {
      hostname: board.hostname, model: board.model,
      release: board.release?.description||'',
      kernel: board.kernel,
      uptimeFmt: _fmtUptime(info.uptime),
      load: (info.load||[]).map(l=>(l/65536).toFixed(2)),
      memory: {
        total: info.memory?.total||0, free: info.memory?.free||0,
        usagePct: info.memory?.total ? Math.round((1-info.memory.free/info.memory.total)*100) : 0
      }
    }
  }

  async getNetworkInterfaces() {
    const r = await this.call('network.interface','dump')
    return (r.interface||[]).map(i=>({
      name:i.interface, up:i.up, proto:i.proto,
      ip:i['ipv4-address']?.[0]?.address,
      rxBytes:i.statistics?.rx_bytes||0, txBytes:i.statistics?.tx_bytes||0
    }))
  }

  async getNetworkStats() {
    try {
      const f = await this.call('file','read',{path:'/proc/net/dev'})
      const stats = {}
      ;(f.data||'').split('\n').slice(2).forEach(line=>{
        const p = line.trim().split(/[:\s]+/).filter(Boolean)
        if (p.length>=10) stats[p[0]] = {rxBytes:+p[1]||0, txBytes:+p[9]||0}
      })
      return stats
    } catch {
      const ifaces = await this.getNetworkInterfaces()
      const stats = {}
      ifaces.forEach(i=>{ if(i.name) stats[i.name]={rxBytes:i.rxBytes,txBytes:i.txBytes} })
      return stats
    }
  }

  async getDHCPLeases() {
    try {
      const r = await this.call('luci-rpc','getDHCPLeases')
      const l = r.leases||r||[]
      if (Array.isArray(l)&&l.length) return l.map(d=>({ip:d.ipaddr||d.ip||'',mac:(d.macaddr||d.mac||'').toUpperCase(),hostname:d.hostname||''})).filter(d=>d.ip)
    } catch {}
    try {
      const f = await this.call('file','read',{path:'/tmp/dhcp.leases'})
      const lines = (f.data||'').trim().split('\n').filter(Boolean)
      const result = lines.map(line=>{ const [,mac,ip,name]=line.split(' '); return {mac:(mac||'').toUpperCase(),ip:ip||'',hostname:name==='*'?'':name||''} }).filter(d=>d.ip)
      if (result.length) return result
    } catch {}
    try {
      const f = await this.call('file','read',{path:'/proc/net/arp'})
      return (f.data||'').split('\n').slice(1).map(line=>{
        const p=line.trim().split(/\s+/)
        if (p.length>=6&&(p[2]==='0x2'||p[2]==='0x0')&&p[3]!=='00:00:00:00:00:00') return {ip:p[0],mac:p[3].toUpperCase(),hostname:''}
        return null
      }).filter(d=>d&&d.ip&&!d.ip.startsWith('0.'))
    } catch {}
    return []
  }

  async getFirewallData() {
    const r = await this.call('uci','get',{config:'firewall'})
    const vals = r.values||{}
    const rules=[],zones=[],redirects=[]
    const first = Object.values(vals)[0]||{}
    if (typeof first==='object'&&'.type' in first) {
      Object.values(vals).forEach(v=>{ if(!v||typeof v!=='object') return; const t=v['.type']; if(t==='rule') rules.push(v); else if(t==='zone') zones.push(v); else if(t==='redirect') redirects.push(v) })
    } else {
      const map={}
      Object.entries(vals).forEach(([k,v])=>{ const m=k.match(/^firewall\.@(\w+)\[(\d+)\]\.(.+)$/); if(m){const key=`${m[1]}_${m[2]}`; if(!map[key]) map[key]={_idx:+m[2],_type:m[1]}; map[key][m[3]]=v} })
      Object.values(map).forEach(s=>{ if(s._type==='rule') rules.push(s); else if(s._type==='zone') zones.push(s); else if(s._type==='redirect') redirects.push(s) })
    }
    return {rules,zones,redirects}
  }

  async getLog() {
    try { const r=await this.call('file','exec',{command:'/sbin/logread',args:['-l','200']}); return (r.stdout||'').split('\n').filter(Boolean) } catch { return [] }
  }

  async reboot() { await this.call('system','reboot') }
  async execCommand(cmd,args=[]) { return this.call('file','exec',{command:cmd,args}) }
}

function _errMsg(code) { return {2:'参数错误',3:'方法不存在',6:'权限不足',7:'超时'}[code]||`ubus错误(${code})` }
function _fmtUptime(s) {
  if(!s) return '--'
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60)
  return d>0?`${d}天${h}时${m}分`:h>0?`${h}时${m}分`:`${m}分`
}
function _fmtBytes(b) {
  if(b>1073741824) return (b/1073741824).toFixed(2)+' GB'
  if(b>1048576) return (b/1048576).toFixed(1)+' MB'
  if(b>1024) return (b/1024).toFixed(0)+' KB'
  return b+' B'
}
function _fmtSpeed(bps) {
  if(bps>1048576) return (bps/1048576).toFixed(2)+' MB/s'
  if(bps>1024) return (bps/1024).toFixed(1)+' KB/s'
  return Math.round(bps)+' B/s'
}
function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

// ═══════════════════════════════════════════════════
// 应用状态
// ═══════════════════════════════════════════════════
let client = null
let cfg    = null
let state  = { tab:'dashboard', sysInfo:null, ifaces:[], devices:[], traffic:[], firewall:{rules:[],zones:[],redirects:[]}, fwTab:'rules', log:[], wifiNets:[], sysTab:'info' }
let prev   = null
let pollTimer = null

// ═══════════════════════════════════════════════════
// 初始化：从 URL 读取配置
// ═══════════════════════════════════════════════════
function init() {
  try {
    const params = new URLSearchParams(location.search)
    const cfgStr = params.get('cfg')
    if (!cfgStr) { showError('缺少路由器配置'); return }
    cfg = JSON.parse(decodeURIComponent(cfgStr))
    client = new OpenWrtClient(cfg)
    renderNav()
    switchTab('dashboard')
  } catch(e) {
    showError('配置解析失败: ' + e.message)
  }
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="banner error">⚠ ${_esc(msg)}</div>`
}

// ═══════════════════════════════════════════════════
// 导航
// ═══════════════════════════════════════════════════
const TABS = [
  {key:'dashboard', icon:'🖥', label:'控制台'},
  {key:'devices',   icon:'📱', label:'设备'},
  {key:'traffic',   icon:'📊', label:'流量'},
  {key:'firewall',  icon:'🛡', label:'防火墙'},
  {key:'system',    icon:'⚙️', label:'系统'},
]

function renderNav() {
  document.getElementById('nav').innerHTML = TABS.map(t=>`
    <div class="nav-item ${state.tab===t.key?'active':''}" onclick="switchTab('${t.key}')">
      <span class="icon">${t.icon}</span>
      <span>${t.label}</span>
    </div>
  `).join('')
}

function switchTab(tab) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer=null }
  state.tab = tab
  renderNav()
  switch(tab) {
    case 'dashboard': loadDashboard(); break
    case 'devices':   loadDevices();   break
    case 'traffic':   loadTraffic();   break
    case 'firewall':  loadFirewall();  break
    case 'system':    loadSystem();    break
  }
}

// ═══════════════════════════════════════════════════
// 控制台
// ═══════════════════════════════════════════════════
async function loadDashboard() {
  const el = document.getElementById('content')
  el.innerHTML = '<div class="loading">加载中...</div>'
  try {
    const [info, ifaces] = await Promise.all([client.getSystemInfo(), client.getNetworkInterfaces()])
    state.sysInfo = info
    state.ifaces  = ifaces
    renderDashboard()
    pollTimer = setInterval(async()=>{ try{ const i=await client.getSystemInfo(); state.sysInfo=i; renderDashboard() }catch{} }, 30000)
  } catch(e) {
    el.innerHTML = `<div class="banner error">⚠ ${_esc(e.message)}</div>`
  }
}

function renderDashboard() {
  const info   = state.sysInfo
  const ifaces = state.ifaces
  if (!info) return
  const m = info.memory
  const pct = m.usagePct
  const fillClass = pct>80?'danger':pct>60?'warn':'ok'
  const wan = ifaces.find(i=>i.name==='wan')

  document.getElementById('content').innerHTML = `
    <div class="card">
      ${[['主机名',info.hostname],['型号',info.model],['系统',info.release],['内核',info.kernel],['运行时间',info.uptimeFmt],['负载',info.load.join(' / ')]].map(([l,v])=>`
        <div class="row"><span class="row-label">${l}</span><span class="row-val">${_esc(v||'--')}</span></div>
      `).join('')}
    </div>
    <div class="card">
      <div class="card-title">内存使用 ${pct}%</div>
      <div class="row"><span class="row-label">总计</span><span class="row-val">${_fmtBytes(m.total)}</span></div>
      <div class="row"><span class="row-label">已用</span><span class="row-val">${_fmtBytes(m.total-m.free)}</span></div>
      <div class="progress"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
    </div>
    ${wan?`<div class="card">
      <div class="card-title">WAN 接口</div>
      <div class="row"><span class="row-label">IP</span><span class="row-val">${_esc(wan.ip||'--')}</span></div>
      <div class="row"><span class="row-label">累计下载</span><span class="row-val" style="color:var(--blue)">${_fmtBytes(wan.rxBytes)}</span></div>
      <div class="row"><span class="row-label">累计上传</span><span class="row-val" style="color:var(--green)">${_fmtBytes(wan.txBytes)}</span></div>
    </div>`:''}
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-danger" style="flex:1" onclick="doReboot()">⟳ 重启路由器</button>
      <button class="btn btn-secondary" style="flex:1" onclick="doDisconnect()">⇠ 断开</button>
    </div>
  `
}

async function doReboot() {
  if (!confirm('确定重启路由器？')) return
  try { await client.reboot(); alert('重启指令已发送') } catch(e) { alert(e.message) }
}

function doDisconnect() {
  if (typeof wx !== 'undefined') wx.miniProgram?.postMessage({data:{action:'disconnect'}})
  history.back()
}

// ═══════════════════════════════════════════════════
// 设备管理
// ═══════════════════════════════════════════════════
let deviceKeyword = ''

async function loadDevices() {
  const el = document.getElementById('content')
  el.innerHTML = `
    <div class="search-bar">
      <span>🔍</span>
      <input class="search-input" placeholder="搜索 IP / MAC / 主机名" oninput="filterDevices(this.value)" value="${_esc(deviceKeyword)}">
    </div>
    <div id="device-list"><div class="loading">加载中...</div></div>
  `
  try {
    state.devices = await client.getDHCPLeases()
    renderDeviceList()
    pollTimer = setInterval(async()=>{ try{ state.devices=await client.getDHCPLeases(); renderDeviceList() }catch{} }, 15000)
  } catch(e) {
    document.getElementById('device-list').innerHTML = `<div class="banner error">⚠ ${_esc(e.message)}</div>`
  }
}

function filterDevices(kw) {
  deviceKeyword = kw
  renderDeviceList()
}

function renderDeviceList() {
  const kw = deviceKeyword.toLowerCase()
  const list = kw
    ? state.devices.filter(d=>(d.hostname||'').toLowerCase().includes(kw)||d.ip.includes(kw)||(d.mac||'').toLowerCase().includes(kw))
    : state.devices
  const el = document.getElementById('device-list')
  if (!el) return
  if (list.length === 0) { el.innerHTML = `<div class="empty">${kw?'无匹配结果':'暂无在线设备'}</div>`; return }
  el.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">在线设备 ${list.length} 台</div>` +
    list.map(d=>`
      <div class="device-card">
        <div class="avatar">${(d.hostname||d.ip||'?').charAt(0).toUpperCase()}</div>
        <div class="device-info">
          <div class="device-name">${_esc(d.hostname||'未知设备')}</div>
          <div class="device-sub">${_esc(d.ip)}</div>
          <div class="device-sub">${_esc(d.mac)}</div>
        </div>
        <div class="kick-btn" onclick="kickDevice('${_esc(d.mac)}','${_esc(d.hostname||d.ip)}')">踢出</div>
      </div>
    `).join('')
}

async function kickDevice(mac, name) {
  if (!confirm(`确定踢出「${name}」(${mac})？`)) return
  try {
    await client.execCommand('iptables',['-I','FORWARD','-m','mac','--mac-source',mac,'-j','DROP'])
    state.devices = state.devices.filter(d=>d.mac!==mac)
    renderDeviceList()
    alert('已踢出')
  } catch(e) { alert('操作失败: '+e.message) }
}

// ═══════════════════════════════════════════════════
// 流量统计
// ═══════════════════════════════════════════════════
let trafficHistory = []
let trafficPrev    = null
let activeIface    = 'wan'

async function loadTraffic() {
  const el = document.getElementById('content')
  try {
    const ifaces = await client.getNetworkInterfaces()
    state.ifaces = ifaces
    if (!ifaces.find(i=>i.name===activeIface)) activeIface = ifaces[0]?.name||'wan'
    renderTraffic()
    pollTimer = setInterval(async()=>{ try{ await pollTraffic() }catch{} }, 3000)
    pollTraffic()
  } catch(e) {
    el.innerHTML = `<div class="banner error">⚠ ${_esc(e.message)}</div>`
  }
}

async function pollTraffic() {
  const stats  = await client.getNetworkStats()
  const ifKeys = Object.keys(stats).filter(k=>k!=='lo')
  const key    = ifKeys.find(k=>k===activeIface||k.includes('wan'))||ifKeys[0]
  if (!key) return
  const now = {rx:stats[key].rxBytes, tx:stats[key].txBytes, ts:Date.now()}
  let rxRate=0, txRate=0
  if (trafficPrev) {
    const dt=(now.ts-trafficPrev.ts)/1000
    if (dt>0) { rxRate=Math.max(0,(now.rx-trafficPrev.rx)/dt); txRate=Math.max(0,(now.tx-trafficPrev.tx)/dt) }
  }
  trafficPrev = now
  trafficHistory.push({rx:rxRate, tx:txRate})
  if (trafficHistory.length>30) trafficHistory.shift()
  renderTrafficData(rxRate, txRate)
}

function renderTraffic() {
  document.getElementById('content').innerHTML = `
    <div style="overflow-x:auto;white-space:nowrap;margin-bottom:14px">
      ${state.ifaces.map(i=>`
        <span onclick="setIface('${_esc(i.name)}')" style="display:inline-block;padding:6px 14px;margin-right:6px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:${activeIface===i.name?'rgba(79,142,247,.15)':'var(--bg2)'};color:${activeIface===i.name?'var(--blue)':'var(--muted)'}">
          ${_esc(i.name)} <span style="width:6px;height:6px;border-radius:50%;background:${i.up?'var(--green)':'#555'};display:inline-block;vertical-align:middle;margin-left:4px"></span>
        </span>
      `).join('')}
    </div>
    <div class="speed-row">
      <div class="speed-card"><div class="speed-label">↓ 下行</div><div class="speed-val rx" id="rx-speed">--</div></div>
      <div class="speed-card"><div class="speed-label">↑ 上行</div><div class="speed-val tx" id="tx-speed">--</div></div>
    </div>
    <div class="chart">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">实时速率</div>
      <div class="bars" id="traffic-bars"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div><span>下行</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><span>上行</span></div>
      </div>
    </div>
  `
}

function renderTrafficData(rxRate, txRate) {
  const rx = document.getElementById('rx-speed')
  const tx = document.getElementById('tx-speed')
  const bars = document.getElementById('traffic-bars')
  if (rx) rx.textContent = _fmtSpeed(rxRate)
  if (tx) tx.textContent = _fmtSpeed(txRate)
  if (bars) {
    const max = Math.max(...trafficHistory.map(s=>Math.max(s.rx,s.tx)),1)
    bars.innerHTML = trafficHistory.slice(-20).map(s=>`
      <div class="bar-group">
        <div class="bar" style="height:${Math.max(2,s.rx/max*60)}px;background:var(--blue)"></div>
        <div class="bar" style="height:${Math.max(2,s.tx/max*60)}px;background:var(--green)"></div>
      </div>
    `).join('')
  }
}

function setIface(name) {
  activeIface = name
  trafficPrev = null
  trafficHistory = []
  renderTraffic()
  pollTraffic()
}

// ═══════════════════════════════════════════════════
// 防火墙
// ═══════════════════════════════════════════════════
let fwTab = 'rules'

async function loadFirewall() {
  const el = document.getElementById('content')
  el.innerHTML = '<div class="loading">加载中...</div>'
  try {
    state.firewall = await client.getFirewallData()
    renderFirewall()
  } catch(e) {
    el.innerHTML = `<div class="banner error">⚠ ${_esc(e.message)}</div>`
  }
}

function renderFirewall() {
  const fw = state.firewall
  const rules = fw.rules||[], zones = fw.zones||[], redirects = fw.redirects||[]
  document.getElementById('content').innerHTML = `
    <div class="tab-bar">
      ${[['rules',`规则(${rules.length})`],['zones',`区域(${zones.length})`],['redirects',`转发(${redirects.length})`]].map(([k,l])=>`
        <div class="tab ${fwTab===k?'active':''}" onclick="switchFwTab('${k}')">${l}</div>
      `).join('')}
    </div>
    <div id="fw-content"></div>
  `
  renderFwContent()
}

function switchFwTab(tab) {
  fwTab = tab
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['rules','zones','redirects'][i]===tab))
  renderFwContent()
}

function renderFwContent() {
  const el = document.getElementById('fw-content')
  if (!el) return
  if (fwTab==='rules') {
    const rules = state.firewall.rules||[]
    if (!rules.length) { el.innerHTML='<div class="empty">暂无规则</div>'; return }
    el.innerHTML = rules.map((r,i)=>`
      <div class="rule-card">
        <div class="rule-header">
          <div class="rule-name">${_esc(r.name||r['.name']||'未命名')}</div>
          <div class="rule-actions">
            <span class="badge ${(r.target||'ACCEPT')==='ACCEPT'?'accept':'drop'}">${_esc(r.target||'ACCEPT')}</span>
            <span class="del-btn" onclick="deleteRule(${i})">删除</span>
          </div>
        </div>
        <div class="rule-meta">${_esc(r.src||'any')} → ${_esc(r.dest||'any')} · ${_esc(r.proto||'any')}${r.dest_port?':'+_esc(r.dest_port):''}</div>
      </div>
    `).join('')
  } else if (fwTab==='zones') {
    const zones = state.firewall.zones||[]
    if (!zones.length) { el.innerHTML='<div class="empty">暂无区域</div>'; return }
    el.innerHTML = zones.map(z=>`
      <div class="card">
        <div style="font-weight:600;margin-bottom:8px">${_esc(z.name||z['.name']||'未知')}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          ${[['入站',z.input],['出站',z.output],['转发',z.forward]].map(([l,v])=>`
            <span style="font-size:12px;color:var(--muted)">${l}: <span class="badge ${(v||'DROP')==='ACCEPT'?'accept':'drop'}">${v||'-'}</span></span>
          `).join('')}
          ${(z.masq==='1'||z.masq===true)?'<span style="font-size:12px;color:var(--muted)">NAT: <span class="badge accept">是</span></span>':''}
        </div>
      </div>
    `).join('')
  } else {
    const redirects = state.firewall.redirects||[]
    if (!redirects.length) { el.innerHTML='<div class="empty">暂无端口转发</div>'; return }
    el.innerHTML = redirects.map(r=>`
      <div class="rule-card">
        <div class="rule-name">${_esc(r.name||r['.name']||'未命名')}</div>
        <div class="rule-meta">${_esc(r.proto||'tcp')} · 外部:${_esc(r.src_dport||'-')} → ${_esc(r.dest_ip||'-')}:${_esc(r.dest_port||r.src_dport||'-')}</div>
      </div>
    `).join('')
  }
}

async function deleteRule(idx) {
  if (!confirm('确定删除此规则？')) return
  const r = state.firewall.rules[idx]
  if (!r) return
  try {
    const sn = r['.name']||r._s
    if (sn) await client.call('uci','delete',{config:'firewall',section:sn})
    else    await client.call('uci','delete',{config:'firewall',type:'rule',match:{'.index':r._idx}})
    await client.call('uci','commit',{config:'firewall'})
    state.firewall.rules.splice(idx,1)
    renderFirewall()
  } catch(e) { alert('删除失败: '+e.message) }
}

// ═══════════════════════════════════════════════════
// 系统
// ═══════════════════════════════════════════════════
let sysTab = 'info'

async function loadSystem() {
  const el = document.getElementById('content')
  el.innerHTML = `
    <div class="tab-bar">
      ${[['info','系统信息'],['wifi','WiFi'],['log','日志']].map(([k,l])=>`
        <div class="tab ${sysTab===k?'active':''}" onclick="switchSysTab('${k}')">${l}</div>
      `).join('')}
    </div>
    <div id="sys-content"><div class="loading">加载中...</div></div>
  `
  loadSysContent()
}

function switchSysTab(tab) {
  sysTab = tab
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['info','wifi','log'][i]===tab))
  loadSysContent()
}

async function loadSysContent() {
  const el = document.getElementById('sys-content')
  if (!el) return
  el.innerHTML = '<div class="loading">加载中...</div>'
  if (sysTab==='info') {
    try {
      if (!state.sysInfo) state.sysInfo = await client.getSystemInfo()
      const info = state.sysInfo
      const pct  = info.memory.usagePct
      el.innerHTML = `
        <div class="card">
          ${[['主机名',info.hostname],['型号',info.model],['系统',info.release],['内核',info.kernel],['运行时间',info.uptimeFmt],['负载',info.load.join(' / ')],['内存',pct+'%']].map(([l,v])=>`
            <div class="row"><span class="row-label">${l}</span><span class="row-val">${_esc(v||'--')}</span></div>
          `).join('')}
          <div class="progress" style="margin-top:8px"><div class="progress-fill ${pct>80?'danger':pct>60?'warn':'ok'}" style="width:${pct}%"></div></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-danger" onclick="doReboot()">⟳ 重启</button>
          <button class="btn btn-secondary" onclick="doOpkgUpgrade()">↑ 检查升级</button>
          <button class="btn btn-secondary" onclick="loadSysContent()">↻ 刷新</button>
        </div>
      `
    } catch(e) { el.innerHTML=`<div class="banner error">⚠ ${_esc(e.message)}</div>` }
  } else if (sysTab==='wifi') {
    try {
      const r = await client.call('uci','get',{config:'wireless'})
      const vals = r.values||{}
      const nets = []
      Object.entries(vals).forEach(([k,v])=>{ if(typeof v==='object'&&v.ssid) nets.push({_s:k,...v}) })
      if (!nets.length) { el.innerHTML='<div class="empty">未检测到 WiFi 接口</div>'; return }
      el.innerHTML = nets.map(n=>`
        <div class="card">
          <div style="font-weight:600;margin-bottom:8px">${_esc(n.ssid||'隐藏网络')}</div>
          <div class="row"><span class="row-label">接口</span><span class="row-val">${_esc(n._s)}</span></div>
          <div class="row"><span class="row-label">加密</span><span class="row-val">${_esc(n.encryption||'none')}</span></div>
          <div style="margin-top:10px">
            <input class="input" id="pwd-${_esc(n._s)}" placeholder="新密码（至少8位）" type="password" style="margin-bottom:8px">
            <button class="btn btn-primary" onclick="saveWifiPwd('${_esc(n._s)}')">更新密码</button>
          </div>
        </div>
      `).join('')
    } catch(e) { el.innerHTML=`<div class="banner error">⚠ ${_esc(e.message)}</div>` }
  } else {
    try {
      const lines = await client.getLog()
      if (!lines.length) { el.innerHTML='<div class="empty">暂无日志</div>'; return }
      el.innerHTML = `
        <div style="background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:60vh;overflow-y:auto;font-family:monospace;font-size:11px;line-height:1.6">
          ${lines.slice(-100).map(l=>{
            const cls = /err|ERR|error/.test(l)?'color:var(--red)':/warn|WARN/.test(l)?'color:var(--yellow)':'color:#7ee787'
            return `<div style="${cls}">${_esc(l)}</div>`
          }).join('')}
        </div>
      `
    } catch(e) { el.innerHTML=`<div class="banner error">⚠ ${_esc(e.message)}</div>` }
  }
}

async function saveWifiPwd(iface) {
  const input = document.getElementById('pwd-'+iface)
  const pwd   = input?.value||''
  if (pwd.length < 8) { alert('密码至少 8 位'); return }
  try {
    await client.call('uci','set',{config:'wireless',section:iface,values:{key:pwd}})
    await client.call('uci','commit',{config:'wireless'})
    await client.execCommand('wifi').catch(()=>{})
    alert('密码已更新，设备需重新连接')
    input.value = ''
  } catch(e) { alert('更新失败: '+e.message) }
}

async function doOpkgUpgrade() {
  alert('正在检查更新...')
  try {
    const r = await client.execCommand('opkg',['list-upgradable'])
    alert(r.stdout?.trim()||'当前已是最新版本')
  } catch(e) { alert('检查失败: '+e.message) }
}

// 启动
init()
</script>
