name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: release
        type: choice
        options: [release, debug]

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}
  BUILD_TYPE:  ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Android APK (全架构)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''          # 手动管理，避免 lock 文件问题

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: mobile/node_modules
          key: nm-android-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: nm-android-

      - name: npm install
        if: steps.nm-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Restore signing keystore
        if: ${{ env.BUILD_TYPE == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d \
            > mobile/android/app/release.keystore
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Append gradle.properties
        working-directory: mobile/android
        run: |
          cat >> gradle.properties << 'EOF'
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Bundle JS assets
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APKs
        working-directory: mobile/android
        run: |
          SIGNING_ARGS=""
          if [ "${{ env.HAS_KEYSTORE }}" = "true" ]; then
            SIGNING_ARGS="-PkeystoreFile=$(pwd)/app/release.keystore \
              -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
              -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} \
              -PstorePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
          fi

          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            ./gradlew assembleRelease \
              -PversionName="${{ env.APP_VERSION }}" \
              -PversionCode="${{ github.run_number }}" \
              -PenableSeparateBuildPerCPUArchitecture=true \
              -PuniversalApk=true \
              $SIGNING_ARGS
          else
            ./gradlew assembleDebug \
              -PversionName="${{ env.APP_VERSION }}" \
              -PversionCode="${{ github.run_number }}"
          fi

      - name: Collect and rename APKs
        run: |
          VER="${{ env.APP_VERSION }}"
          TYPE="${{ env.BUILD_TYPE }}"
          SRC="mobile/android/app/build/outputs/apk/${TYPE}"
          mkdir -p apks

          declare -A ABI_NAMES=(
            ["armeabi-v7a"]="armv7"
            ["arm64-v8a"]="arm64"
            ["x86"]="x86"
            ["x86_64"]="x86_64"
          )

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="${SRC}/app-${abi}-${TYPE}.apk"
            if [ -f "$src" ]; then
              name="${ABI_NAMES[$abi]}"
              cp "$src" "apks/OpenWrtManager-${VER}-android-${name}.apk"
              echo "✓ android-${name}: $(du -sh apks/OpenWrtManager-${VER}-android-${name}.apk | cut -f1)"
            fi
          done

          # Universal APK（尝试多个可能的文件名）
          for candidate in \
            "${SRC}/app-universal-${TYPE}.apk" \
            "${SRC}/app-${TYPE}.apk"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "apks/OpenWrtManager-${VER}-android-universal.apk"
              echo "✓ android-universal: $(du -sh apks/OpenWrtManager-${VER}-android-universal.apk | cut -f1)"
              break
            fi
          done

          echo "=== 最终产物 ==="
          ls -lh apks/

      - name: Build summary
        run: |
          echo "## Android 构建结果 — ${{ env.APP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 大小 | 适用设备 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          for f in apks/*.apk; do
            sz=$(du -h "$f" | cut -f1)
            nm=$(basename "$f")
            case "$nm" in
              *arm64*)    desc="主流 Android 手机（ARM64，推荐）" ;;
              *armv7*)    desc="老款 Android 手机（ARMv7）" ;;
              *x86_64*)   desc="x86_64 平板/模拟器" ;;
              *x86*)      desc="x86 模拟器" ;;
              *universal*)desc="通用包（所有架构）" ;;
              *)          desc="—" ;;
            esac
            echo "| \`$nm\` | $sz | $desc |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apks/*.apk
          retention-days: 7
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  # Release
  # ══════════════════════════════════════════════════════════
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          append_body: true
          body: |
            ## Android 下载

            | 文件 | 适用设备 |
            |------|---------|
            | `*-android-arm64.apk` | 主流 Android 手机（ARM64）✅ 推荐 |
            | `*-android-armv7.apk` | 老款 Android 手机（ARMv7）|
            | `*-android-x86_64.apk` | x86_64 平板/模拟器 |
            | `*-android-x86.apk` | x86 模拟器 |
            | `*-android-universal.apk` | 通用包（不确定时选此）|

            > 安装前在手机设置中开启「允许未知来源安装」
          files: files/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
