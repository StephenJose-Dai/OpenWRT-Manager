name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: release
        type: choice
        options: [release, debug]

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}
  BUILD_TYPE:  ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    environment: OPAndroid   # 读取 OPAndroid 环境下的 secrets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: mobile/node_modules
          key: nm-android-${{ hashFiles('mobile/package.json') }}
          restore-keys: nm-android-

      - name: npm install
        working-directory: mobile
        run: |
          # 无论 cache 是否命中都执行，确保 node_modules 完整
          # cache 命中时用 --prefer-offline 跳过网络请求，速度快
          if [ "${{ steps.nm-cache.outputs.cache-hit }}" = "true" ]; then
            npm install --legacy-peer-deps --prefer-offline
          else
            npm install --legacy-peer-deps
          fi
          # 确认关键的 gradle 插件存在
          ls node_modules/@react-native/gradle-plugin/ || (echo "MISSING gradle-plugin" && exit 1)

      - uses: android-actions/setup-android@v3

      - name: Install NDK 26
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Generate debug keystore
        working-directory: mobile/android/app
        run: |
          # debug.keystore 在 .gitignore 里，需要在 CI 里生成
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair               -v               -storetype PKCS12               -keystore debug.keystore               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -storepass android               -keypass android               -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ debug.keystore generated"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Restore signing keystore
        if: env.BUILD_TYPE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，将使用 debug 密钥签名"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "✓ Keystore 已恢复"
          fi

      - name: Patch gradle.properties
        working-directory: mobile/android
        run: |
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"    >> gradle.properties
          echo "org.gradle.parallel=true"                                   >> gradle.properties

      - name: Bundle JS assets
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Verify node_modules for gradle
        run: |
          echo "Checking gradle plugin path..."
          ls mobile/node_modules/@react-native/gradle-plugin/ 2>/dev/null             && echo "✓ gradle-plugin found"             || (echo "❌ MISSING: mobile/node_modules/@react-native/gradle-plugin" && exit 1)
          ls mobile/node_modules/@react-native-community/cli-platform-android/ 2>/dev/null             && echo "✓ cli-platform-android found"             || echo "⚠ cli-platform-android not found (may be ok)"

      - name: Build APKs (debug)
        if: env.BUILD_TYPE == 'debug'
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ env.APP_VERSION }}" \
            -PversionCode="${{ github.run_number }}" \
            -PenableSeparateBuildPerCPUArchitecture=true

      - name: Build APKs (release)
        if: env.BUILD_TYPE == 'release'
        working-directory: mobile/android
        env:
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SIGN=""
          if [ "$HAS_KEYSTORE" = "true" ]; then
            SIGN="-PkeystoreFile=$(pwd)/app/release.keystore \
              -PkeyAlias=$KEY_ALIAS \
              -PkeyPassword=$KEY_PASSWORD \
              -PstorePassword=$STORE_PASSWORD"
          fi
          ./gradlew assembleRelease \
            -PversionName="${{ env.APP_VERSION }}" \
            -PversionCode="${{ github.run_number }}" \
            -PenableSeparateBuildPerCPUArchitecture=true \
            $SIGN

      - name: Collect APKs
        run: |
          VER="${{ env.APP_VERSION }}"
          TYPE="${{ env.BUILD_TYPE }}"
          SRC="mobile/android/app/build/outputs/apk/${TYPE}"
          mkdir -p apks
          declare -A ABI_NAMES=(["armeabi-v7a"]="armv7" ["arm64-v8a"]="arm64" ["x86"]="x86" ["x86_64"]="x86_64")
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="${SRC}/app-${abi}-${TYPE}.apk"
            [ -f "$src" ] && cp "$src" "apks/OpenWrtManager-${VER}-android-${ABI_NAMES[$abi]}-${TYPE}.apk"
          done
          # Universal APK（如果存在）
          for candidate in             "${SRC}/app-universal-${TYPE}.apk"             "${SRC}/app-${TYPE}.apk"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "apks/OpenWrtManager-${VER}-android-universal-${TYPE}.apk"
              echo "✓ universal APK collected"
              break
            fi
          done
          ls -lh apks/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ env.BUILD_TYPE }}
          path: apks/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks-${{ env.BUILD_TYPE }}
          path: files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          append_body: true
          files: files/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
