name: CI Check

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]

jobs:
  check-desktop:
    name: Desktop lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-ci-desktop-${{ hashFiles('desktop/package-lock.json') }}

      - name: npm ci
        if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      - name: Build check
        working-directory: desktop
        run: npm run build

  check-android:
    name: Android Gradle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - uses: actions/cache@v4
        id: c
        with:
          path: mobile/node_modules
          key: nm-ci-android-${{ hashFiles('mobile/package-lock.json') }}

      - name: npm install
        if: steps.c.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - uses: android-actions/setup-android@v3

      - name: Gradle dependency check
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew dependencies --configuration releaseRuntimeClasspath \
            --quiet --no-daemon 2>&1 | tail -5 || true

  check-miniprogram:
    name: Miniprogram syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          npx --yes acorn \
            --ecma2020 --module \
            miniprogram/utils/openwrt.js \
            miniprogram/app.js > /dev/null
          echo "✓ 小程序 JS 语法检查通过"
