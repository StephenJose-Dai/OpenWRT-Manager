name: Release (All Platforms)

# 此 workflow 协调所有平台的构建，在所有平台编译完成后统一发 Release
# 由 tag push 触发，会并行启动桌面和安卓的构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  actions: read

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # ── 读取版本和 changelog ──────────────────────────────────
  prepare:
    name: 准备发布信息
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.ver.outputs.version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      changelog:  ${{ steps.cl.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史，用于生成 changelog

      - name: 解析版本号
        id: ver
        run: |
          VER="${{ env.APP_VERSION }}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          if [[ "$VER" == *"alpha"* ]] || [[ "$VER" == *"beta"* ]] || [[ "$VER" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: 生成 Changelog（上个 tag 到现在的提交）
        id: cl
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -30)
          else
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          # 多行输出处理
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

  # ── Windows 10/11 ─────────────────────────────────────────
  build-win-modern:
    name: Windows 10/11 (${{ matrix.arch }})
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci

      - name: 构建
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_API_MODE: direct

      - name: Electron 打包
        working-directory: desktop
        run: npx electron-builder --win nsis portable --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 重命名产物
        working-directory: desktop/dist-electron
        shell: pwsh
        run: |
          $ver  = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          # 安装包
          Get-ChildItem "*.exe" | Where-Object { $_.Name -notlike "*portable*" } | ForEach-Object {
            Rename-Item $_.FullName "OpenWrtManager-${ver}-win10-${arch}-setup.exe"
          }
          # 便携版
          Get-ChildItem "*portable*.exe" | ForEach-Object {
            Rename-Item $_.FullName "OpenWrtManager-${ver}-win10-${arch}-portable.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: win-modern-${{ matrix.arch }}
          path: |
            desktop/dist-electron/*-win10-*.exe
          retention-days: 7

  # ── Windows 7/8/8.1 ──────────────────────────────────────
  build-win-legacy:
    name: Windows 7/8 (${{ matrix.arch }})
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - uses: actions/checkout@v4

      # Node 16 是支持 Electron 22 的最高稳定版本
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖（降级至 Electron 22）
        working-directory: desktop
        run: |
          npm ci
          npm install electron@22.3.27 --save-dev --legacy-peer-deps

      - name: 构建
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_API_MODE: direct

      - name: Electron 22 打包
        working-directory: desktop
        shell: pwsh
        run: |
          # 动态覆盖 electronVersion
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $pkg.build | Add-Member -NotePropertyName "electronVersion" -NotePropertyValue "22.3.27" -Force
          $pkg | ConvertTo-Json -Depth 20 | Set-Content "package.json"
          # 只打 nsis（Win7 不支持 portable 格式的某些特性）
          npx electron-builder --win nsis --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 重命名产物
        working-directory: desktop/dist-electron
        shell: pwsh
        run: |
          $ver  = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            Rename-Item $_.FullName "OpenWrtManager-${ver}-win7-${arch}-setup.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: win-legacy-${{ matrix.arch }}
          path: desktop/dist-electron/*-win7-*.exe
          retention-days: 7

  # ── Android ───────────────────────────────────────────────
  build-android:
    name: Android APK (全架构)
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK 26
        run: sdkmanager "ndk;26.1.10909125"

      - name: 安装 Node 依赖
        working-directory: mobile
        run: npm ci

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: 还原签名证书
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d \
            > mobile/android/app/release.keystore

      - name: 写入 Gradle 配置
        working-directory: mobile/android
        run: |
          cat >> gradle.properties << 'EOF'
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: JS Bundle
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 构建分架构 APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ needs.prepare.outputs.version }}" \
            -PversionCode="${{ github.run_number }}" \
            -PenableSeparateBuildPerCPUArchitecture=true \
            -PuniversalApk=true \
            ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format(
              '-PkeystoreFile=app/release.keystore -PkeyAlias={0} -PkeyPassword={1} -PstorePassword={2}',
              secrets.ANDROID_KEY_ALIAS,
              secrets.ANDROID_KEY_PASSWORD,
              secrets.ANDROID_STORE_PASSWORD
            ) || '' }}

      - name: 整理 APK
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          mkdir apks
          declare -A MAP=(["armeabi-v7a"]="armv7" ["arm64-v8a"]="arm64" ["x86"]="x86" ["x86_64"]="x86_64")
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="mobile/android/app/build/outputs/apk/release/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "apks/OpenWrtManager-${VER}-android-${MAP[$abi]}.apk"
          done
          for f in mobile/android/app/build/outputs/apk/release/app-universal-release.apk \
                   mobile/android/app/build/outputs/apk/release/app-release.apk; do
            [ -f "$f" ] && cp "$f" "apks/OpenWrtManager-${VER}-android-universal.apk" && break
          done
          ls -lh apks/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apks/*.apk
          retention-days: 7

  # ── 统一发布 Release ──────────────────────────────────────
  publish-release:
    name: 发布 GitHub Release
    needs: [prepare, build-win-modern, build-win-legacy, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: all-releases

      - name: 列出所有产物
        run: |
          echo "## 发布产物清单" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh all-releases/ | awk '{print "- `"$NF"` ("$5")"}' >> $GITHUB_STEP_SUMMARY

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ needs.prepare.outputs.version }}"
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          draft: false
          body: |
            # OpenWrt Manager ${{ needs.prepare.outputs.version }}

            无后端直连版——通过 ubus HTTP 直接管理 OpenWrt 路由器，支持局域网自动发现、多路由器管理。

            ## 更新内容
            ${{ needs.prepare.outputs.changelog }}

            ---

            ## 下载

            ### Windows 桌面客户端
            | 文件 | 系统要求 | 架构 |
            |------|----------|------|
            | `*-win10-x64-setup.exe` | Windows 10/11 | 64位 ✅ 推荐 |
            | `*-win10-x64-portable.exe` | Windows 10/11 | 64位（免安装） |
            | `*-win10-ia32-setup.exe` | Windows 10/11 | 32位 |
            | `*-win7-x64-setup.exe` | Win 7/8/8.1/10 | 64位（兼容旧系统） |
            | `*-win7-ia32-setup.exe` | Win 7/8/8.1/10 | 32位（兼容旧系统） |

            ### Android 手机 APP
            | 文件 | 适用设备 |
            |------|----------|
            | `*-android-arm64.apk` | 2016年后的主流 Android 手机 ✅ 推荐 |
            | `*-android-armv7.apk` | 老款 Android 手机（ARMv7） |
            | `*-android-x86_64.apk` | x86_64 平板 / 模拟器 |
            | `*-android-x86.apk` | 老款 x86 平板 / 模拟器 |
            | `*-android-universal.apk` | 通用包（不确定时选此） |

            ---

            ## 路由器端初始化（一次性）
            ```bash
            opkg update && opkg install rpcd uhttpd-mod-ubus luci-mod-rpc
            uci set uhttpd.main.ubus_cors=1
            uci commit uhttpd && /etc/init.d/uhttpd restart
            ```

            ## 微信小程序
            见仓库 `miniprogram/` 目录，导入微信开发者工具后自行发布。
          files: all-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
