name: Release (All Platforms)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（手动触发时使用）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version || '1.0.0') }}

jobs:
  # ── 准备阶段：读取版本和 changelog ───────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version:       ${{ steps.info.outputs.version }}
      is_prerelease: ${{ steps.info.outputs.is_prerelease }}
      changelog:     ${{ steps.info.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version info
        id: info
        run: |
          VER="${{ env.APP_VERSION }}"
          echo "version=$VER" >> $GITHUB_OUTPUT

          if echo "$VER" | grep -qE '(alpha|beta|rc)'; then
            echo "is_prerelease=true"  >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            LOG=$(git log "${PREV}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "changelog<<__EOF__"
            echo "${LOG:-（无更新记录）}"
            echo "__EOF__"
          } >> $GITHUB_OUTPUT

  # ── Windows 10/11 ─────────────────────────────────────────
  win-modern:
    needs: prepare
    name: Windows 10/11 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-modern-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: npm ci
        if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci


      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Package
        working-directory: desktop
        run: npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename
        shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v="${{ needs.prepare.outputs.version }}"; $a="${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            $t = if ($_.Name -match "(?i)portable") {"portable"} else {"setup"}
            Rename-Item $_.FullName "OpenWrtManager-${v}-win10-${a}-${t}.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: win-modern-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 3

  # ── Windows 7/8/8.1 ──────────────────────────────────────
  win-legacy:
    needs: prepare
    name: Windows 7/8 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''

      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-legacy-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install + Electron 22
        working-directory: desktop
        shell: pwsh
        run: |
          if ("${{ steps.c.outputs.cache-hit }}" -ne "true") { npm ci }
          npm install electron@22.3.27 --save-dev --legacy-peer-deps --no-save


      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Patch package.json
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Get-Content package.json | ConvertFrom-Json
          if (-not ($p.build | Get-Member electronVersion -EA 0)) {
            $p.build | Add-Member -NotePropertyName electronVersion -NotePropertyValue "22.3.27"
          } else { $p.build.electronVersion = "22.3.27" }
          $p.build.win.target = @(@{target="nsis";arch=@("${{ matrix.arch }}")})
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json

      - name: Package
        working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename
        shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v="${{ needs.prepare.outputs.version }}"; $a="${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            Rename-Item $_.FullName "OpenWrtManager-${v}-win7-${a}-setup.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: win-legacy-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 3

  # ── Android ───────────────────────────────────────────────
  android:
    needs: prepare
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - uses: actions/cache@v4
        id: c
        with:
          path: mobile/node_modules
          key: nm-android-${{ hashFiles('mobile/package-lock.json') }}

      - name: npm install
        if: steps.c.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "ndk;26.1.10909125"

      - name: Restore keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d \
            > mobile/android/app/release.keystore
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV

      - name: Patch gradle.properties
        working-directory: mobile/android
        run: |
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: JS bundle
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APKs
        working-directory: mobile/android
        run: |
          SIGN=""
          [ "$HAS_KEYSTORE" = "true" ] && SIGN="-PkeystoreFile=$(pwd)/app/release.keystore \
            -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -PstorePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
          ./gradlew assembleRelease \
            -PversionName="${{ needs.prepare.outputs.version }}" \
            -PversionCode="${{ github.run_number }}" \
            -PenableSeparateBuildPerCPUArchitecture=true \
            -PuniversalApk=true \
            $SIGN

      - name: Collect APKs
        run: |
          V="${{ needs.prepare.outputs.version }}"
          S="mobile/android/app/build/outputs/apk/release"
          mkdir apks
          declare -A M=(["armeabi-v7a"]="armv7" ["arm64-v8a"]="arm64" ["x86"]="x86" ["x86_64"]="x86_64")
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            [ -f "$S/app-${abi}-release.apk" ] && \
              cp "$S/app-${abi}-release.apk" "apks/OpenWrtManager-${V}-android-${M[$abi]}.apk"
          done
          for f in "$S/app-universal-release.apk" "$S/app-release.apk"; do
            [ -f "$f" ] && cp "$f" "apks/OpenWrtManager-${V}-android-universal.apk" && break
          done
          ls -lh apks/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apks/*.apk
          retention-days: 3
          if-no-files-found: error

  # ── 统一发布 Release ──────────────────────────────────────
  publish:
    needs: [prepare, win-modern, win-legacy, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: all

      - name: Summary
        run: |
          echo "## 发布产物 — ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          ls -lh all/ | awk 'NR>1{print "- `"$NF"` ("$5")"}' >> $GITHUB_STEP_SUMMARY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ needs.prepare.outputs.version }}"
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          body: |
            # OpenWrt Manager ${{ needs.prepare.outputs.version }}

            OpenWrt 路由器无后端直连管理工具，通过 ubus HTTP 直连路由器。

            ## 更新内容
            ${{ needs.prepare.outputs.changelog }}

            ---

            ## 下载

            ### Windows 桌面客户端
            | 文件 | 系统 | 架构 |
            |------|------|------|
            | `*-win10-x64-setup.exe` | Windows 10/11 | 64位 ✅ 推荐 |
            | `*-win10-x64-portable.exe` | Windows 10/11 | 64位（免安装）|
            | `*-win10-ia32-setup.exe` | Windows 10/11 | 32位 |
            | `*-win7-x64-setup.exe` | Win 7/8/8.1 | 64位（兼容旧系统）|
            | `*-win7-ia32-setup.exe` | Win 7/8/8.1 | 32位（兼容旧系统）|

            ### Android 手机 APP
            | 文件 | 适用设备 |
            |------|---------|
            | `*-android-arm64.apk` | 主流 Android 手机 ✅ 推荐 |
            | `*-android-armv7.apk` | 老款 Android（ARMv7）|
            | `*-android-x86_64.apk` | x86_64 平板/模拟器 |
            | `*-android-x86.apk` | x86 模拟器 |
            | `*-android-universal.apk` | 通用包（不确定架构选此）|

            ---

            ## 路由器端初始化（一次性）
            ```bash
            opkg update && opkg install rpcd uhttpd-mod-ubus luci-mod-rpc
            uci set uhttpd.main.ubus_cors=1
            uci commit uhttpd && /etc/init.d/uhttpd restart
            ```

            ## 微信小程序
            见仓库 `miniprogram/` 目录，用微信开发者工具导入后发布。
          files: all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
