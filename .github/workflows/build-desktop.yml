name: Build Desktop (Windows)

on:
  push:
    tags:
      - 'v*'          # 打 tag 时触发，如 v1.0.0
  workflow_dispatch:  # 也支持手动触发
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write   # 允许上传 Release

# ─── 版本号统一处理 ─────────────────────────────────────────
env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  # ══════════════════════════════════════════════════════════
  # Job 1: Windows 10/11 现代版（最新 Electron，x64 + x86）
  # ══════════════════════════════════════════════════════════
  build-windows-modern:
    name: Windows 10/11 (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]   # ia32 = x86 32位

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci

      - name: 构建 React 前端
        working-directory: desktop
        run: npm run build
        env:
          VITE_API_MODE: direct   # 直连模式，无需后端

      - name: 打包 Electron（Win10/11，${{ matrix.arch }}）
        working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不签名（开源项目，如需签名请添加 CSC_LINK / CSC_KEY_PASSWORD）

      - name: 重命名产物
        working-directory: desktop
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $ver  = "${{ env.APP_VERSION }}"
          $src  = Get-ChildItem "dist-electron\*.exe" | Select-Object -First 1
          $dst  = "dist-electron\OpenWrtManager-${ver}-win10-${arch}-setup.exe"
          Move-Item $src.FullName $dst
          echo "ARTIFACT_PATH=$dst" >> $env:GITHUB_ENV

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-modern-${{ matrix.arch }}
          path: desktop/${{ env.ARTIFACT_PATH }}
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # Job 2: Windows 7/8/8.1 兼容版（Electron 22，x64 + x86）
  # ══════════════════════════════════════════════════════════
  build-windows-legacy:
    name: Windows 7/8/8.1 (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 16（与 Electron 22 匹配）
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖（锁定 Electron 22 兼容版本）
        working-directory: desktop
        run: |
          npm ci
          npm install --save-dev electron@22.3.27 --legacy-peer-deps

      - name: 构建 React 前端
        working-directory: desktop
        run: npm run build
        env:
          VITE_API_MODE: direct

      - name: 打包 Electron（Win7/8 兼容，${{ matrix.arch }}）
        working-directory: desktop
        shell: pwsh
        run: |
          # 临时覆盖 electron-builder 配置，强制使用 Electron 22
          $config = Get-Content "package.json" | ConvertFrom-Json
          $config.build.electronVersion = "22.3.27"
          $config | ConvertTo-Json -Depth 10 | Set-Content "package.json"
          npx electron-builder --win nsis --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 重命名产物（标注 legacy）
        working-directory: desktop
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $ver  = "${{ env.APP_VERSION }}"
          $src  = Get-ChildItem "dist-electron\*.exe" | Select-Object -First 1
          $dst  = "dist-electron\OpenWrtManager-${ver}-win7-${arch}-setup.exe"
          Move-Item $src.FullName $dst
          echo "ARTIFACT_PATH=$dst" >> $env:GITHUB_ENV

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-legacy-${{ matrix.arch }}
          path: desktop/${{ env.ARTIFACT_PATH }}
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # Job 3: 发布 Release（仅在 tag 推送时执行）
  # ══════════════════════════════════════════════════════════
  release-windows:
    name: 发布 Windows Release
    needs: [build-windows-modern, build-windows-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 下载所有 Windows 产物
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: release-files

      - name: 列出产物
        run: ls -la release-files/

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body: |
            ## 下载说明

            ### Windows 版本
            | 文件 | 适用系统 | 架构 |
            |------|----------|------|
            | `*-win10-x64-setup.exe` | Windows 10/11 | 64位（推荐） |
            | `*-win10-ia32-setup.exe` | Windows 10/11 | 32位 |
            | `*-win7-x64-setup.exe` | Windows 7/8/8.1/10 | 64位（兼容旧系统） |
            | `*-win7-ia32-setup.exe` | Windows 7/8/8.1/10 | 32位（兼容旧系统） |

            > **不确定选哪个？** Win10/11 用户选 `win10-x64`，旧系统用 `win7-*`

            ### 路由器端配置
            首次使用请在路由器执行：
            ```bash
            opkg update && opkg install rpcd uhttpd-mod-ubus
            uci set uhttpd.main.ubus_cors=1 && uci commit uhttpd
            /etc/init.d/uhttpd restart
            ```
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
