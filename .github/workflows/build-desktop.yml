name: Build Desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  # ══════════════════════════════════════════════════════════
  # Windows 10/11 — 最新 Electron
  # ══════════════════════════════════════════════════════════
  build-modern:
    name: Windows 10/11 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''          # 不用内置 cache，手动管理

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: desktop/node_modules
          key: nm-modern-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: nm-modern-${{ runner.os }}-

      - name: npm ci
        if: steps.nm-cache.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Package (modern)
        working-directory: desktop
        run: npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts
        shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v = "${{ env.APP_VERSION }}"; $a = "${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            $t = if ($_.Name -match "(?i)portable") { "portable" } else { "setup" }
            Rename-Item $_.FullName "OpenWrtManager-${v}-win10-${a}-${t}.exe"
          }
          Get-ChildItem "*.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: win-modern-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  # Windows 7/8/8.1 — Electron 22
  # ══════════════════════════════════════════════════════════
  build-legacy:
    name: Windows 7/8 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'   # Node 16 与 Electron 22 匹配
          cache: ''

      - name: Cache node_modules (legacy)
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: desktop/node_modules
          key: nm-legacy-${{ runner.os }}-e22-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: nm-legacy-${{ runner.os }}-e22-

      - name: Install + downgrade to Electron 22
        working-directory: desktop
        shell: pwsh
        run: |
          if ("${{ steps.nm-cache.outputs.cache-hit }}" -ne "true") {
            npm ci
          }
          # 强制安装 Electron 22，无论缓存命中与否
          npm install electron@22.3.27 --save-dev --legacy-peer-deps --no-save

      - name: Build frontend
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Patch electron version in package.json
        working-directory: desktop
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          # 注入 electronVersion，只保留 nsis target
          if (-not ($pkg.build | Get-Member electronVersion -EA 0)) {
            $pkg.build | Add-Member -NotePropertyName electronVersion -NotePropertyValue "22.3.27"
          } else { $pkg.build.electronVersion = "22.3.27" }
          $pkg.build.win.target = @(@{ target="nsis"; arch=@("${{ matrix.arch }}") })
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json
          Write-Host "Patched: electronVersion=$(($pkg.build).electronVersion)"

      - name: Package (legacy)
        working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts
        shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v = "${{ env.APP_VERSION }}"; $a = "${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            Rename-Item $_.FullName "OpenWrtManager-${v}-win7-${a}-setup.exe"
          }
          Get-ChildItem "*.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: win-legacy-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  # Release（仅 tag）
  # ══════════════════════════════════════════════════════════
  release:
    needs: [build-modern, build-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: win-*
          merge-multiple: true
          path: files

      - run: ls -lh files/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body: |
            ## Windows 下载

            | 文件 | 系统 | 架构 |
            |------|------|------|
            | `*-win10-x64-setup.exe` | Windows 10/11 | 64位 ✅ 推荐 |
            | `*-win10-x64-portable.exe` | Windows 10/11 | 64位免安装 |
            | `*-win10-ia32-setup.exe` | Windows 10/11 | 32位 |
            | `*-win7-x64-setup.exe` | Win 7/8/8.1/10 | 64位（兼容旧系统）|
            | `*-win7-ia32-setup.exe` | Win 7/8/8.1/10 | 32位（兼容旧系统）|
          files: files/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
