name: Build Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  # ── Windows 10/11（最新 Electron）──────────────────────────
  build-win-modern:
    name: Windows 10/11 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-win-modern-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - working-directory: desktop
        run: npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v="${{ env.APP_VERSION }}"; $a="${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            $t = if ($_.Name -match "(?i)portable") {"portable"} else {"setup"}
            Rename-Item $_.FullName "OpenWrtManager-${v}-win10-${a}-${t}.exe"
          }
          Get-ChildItem "*.exe" | Select-Object Name, @{N='Size(KB)';E={[int]($_.Length/1KB)}}
      - uses: actions/upload-artifact@v4
        with:
          name: win-modern-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error

  # ── Windows 7/8/8.1（Electron 22）─────────────────────────
  build-win-legacy:
    name: Windows 7/8 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-win-legacy-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - working-directory: desktop
        shell: pwsh
        run: |
          if ("${{ steps.c.outputs.cache-hit }}" -ne "true") { npm ci }
          npm install electron@22.3.27 --save-dev --legacy-peer-deps --no-save
      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - working-directory: desktop
        shell: pwsh
        run: |
          $p = Get-Content package.json | ConvertFrom-Json
          if (-not ($p.build | Get-Member electronVersion -EA 0)) {
            $p.build | Add-Member -NotePropertyName electronVersion -NotePropertyValue "22.3.27"
          } else { $p.build.electronVersion = "22.3.27" }
          $p.build.win.target = @(@{ target="nsis"; arch=@("${{ matrix.arch }}") })
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json
      - working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v="${{ env.APP_VERSION }}"; $a="${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            Rename-Item $_.FullName "OpenWrtManager-${v}-win7-${a}-setup.exe"
          }
          Get-ChildItem "*.exe" | Select-Object Name, @{N='Size(KB)';E={[int]($_.Length/1KB)}}
      - uses: actions/upload-artifact@v4
        with:
          name: win-legacy-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error

  # ── Linux x64（deb + rpm + AppImage + pacman）──────────────
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-linux-x64-${{ hashFiles('desktop/package-lock.json') }}
      - if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      # 安装 pacman 打包必须的 bsdtar（libarchive-tools）
      - name: Install Linux packaging deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            rpm \
            fakeroot

      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Build Linux packages (x64)
        working-directory: desktop
        run: |
          npx electron-builder \
            --linux deb rpm AppImage pacman \
            --x64 \
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts
        run: |
          V="${{ env.APP_VERSION }}"
          cd desktop/dist-electron
          for f in *.deb;      do mv "$f" "OpenWrtManager-${V}-linux-x64.deb"      2>/dev/null||true; done
          for f in *.rpm;      do mv "$f" "OpenWrtManager-${V}-linux-x64.rpm"      2>/dev/null||true; done
          for f in *.AppImage; do mv "$f" "OpenWrtManager-${V}-linux-x64.AppImage" 2>/dev/null||true; done
          for f in *.pacman;   do mv "$f" "OpenWrtManager-${V}-linux-x64.pacman"   2>/dev/null||true; done
          ls -lh *.deb *.rpm *.AppImage *.pacman 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.rpm
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.pacman
          retention-days: 7
          if-no-files-found: warn

  # ── Linux arm64（deb + rpm + AppImage）─────────────────────
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-linux-arm64-${{ hashFiles('desktop/package-lock.json') }}
      - if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      # arm64 交叉编译工具链 + bsdtar
      - name: Install arm64 cross-compile tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libarchive-tools \
            rpm \
            fakeroot

      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Build Linux packages (arm64)
        working-directory: desktop
        run: |
          npx electron-builder \
            --linux deb rpm AppImage \
            --arm64 \
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts
        run: |
          V="${{ env.APP_VERSION }}"
          cd desktop/dist-electron
          for f in *arm64*.deb *.deb;      do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-arm64.deb"      && break; done
          for f in *aarch64*.rpm *.rpm;    do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-arm64.rpm"      && break; done
          for f in *arm64*.AppImage *.AppImage; do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-arm64.AppImage" && break; done
          ls -lh *.deb *.rpm *.AppImage 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.rpm
            desktop/dist-electron/*.AppImage
          retention-days: 7
          if-no-files-found: warn

  # ── Release（仅 tag 触发）───────────────────────────────────
  release:
    needs: [build-win-modern, build-win-legacy, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{win-*,linux-*}'
          merge-multiple: true
          path: files
      - run: ls -lh files/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body: |
            ## 下载

            ### Windows
            | 文件 | 系统 | 架构 |
            |------|------|------|
            | `*-win10-x64-setup.exe` | Windows 10/11 | 64位 ✅ 推荐 |
            | `*-win10-x64-portable.exe` | Windows 10/11 | 64位免安装 |
            | `*-win10-ia32-setup.exe` | Windows 10/11 | 32位 |
            | `*-win7-x64-setup.exe` | Win 7/8/8.1 | 64位 |
            | `*-win7-ia32-setup.exe` | Win 7/8/8.1 | 32位 |

            ### Linux
            | 文件 | 适用发行版 |
            |------|-----------|
            | `*-linux-x64.deb` | Ubuntu/Debian/Deepin/UOS/UKylin/统信 |
            | `*-linux-x64.rpm` | CentOS/RHEL/Fedora/银河麒麟/中标麒麟 |
            | `*-linux-x64.AppImage` | 所有 Linux（免安装）|
            | `*-linux-x64.pacman` | Arch Linux/Manjaro |
            | `*-linux-arm64.deb` | ARM64 Ubuntu/Debian |
            | `*-linux-arm64.rpm` | ARM64 RHEL/Fedora |
            | `*-linux-arm64.AppImage` | ARM64 所有发行版 |
          files: files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
