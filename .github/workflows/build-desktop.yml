name: Build Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  # ── Windows 10/11（最新 Electron）──────────────────────────
  build-win-modern:
    name: Windows 10/11 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-win-modern-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - working-directory: desktop
        run: npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v="${{ env.APP_VERSION }}"; $a="${{ matrix.arch }}"
          Get-ChildItem "*.exe" | ForEach-Object {
            $t = if ($_.Name -match "(?i)portable") {"portable"} else {"setup"}
            Rename-Item $_.FullName "OpenWrtManager-${v}-win10-${a}-${t}.exe"
          }
          Get-ChildItem "*.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win-modern-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error

  # ── Windows 7/8/8.1（Electron 22）─────────────────────────
  build-win-legacy:
    name: Windows 7/8 — ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-win-legacy-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - working-directory: desktop
        shell: pwsh
        run: |
          if ("${{ steps.c.outputs.cache-hit }}" -ne "true") { npm ci }
          npm install electron@22.3.27 --save-dev --legacy-peer-deps --no-save
      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - working-directory: desktop
        shell: pwsh
        run: |
          $p=Get-Content package.json|ConvertFrom-Json
          if(-not($p.build|Get-Member electronVersion -EA 0)){$p.build|Add-Member -NotePropertyName electronVersion -NotePropertyValue "22.3.27"}else{$p.build.electronVersion="22.3.27"}
          $p.build.win.target=@(@{target="nsis";arch=@("${{ matrix.arch }}")})
          $p|ConvertTo-Json -Depth 20|Set-Content package.json
      - working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        working-directory: desktop/dist-electron
        run: |
          $v="${{ env.APP_VERSION }}"; $a="${{ matrix.arch }}"
          Get-ChildItem "*.exe"|ForEach-Object{Rename-Item $_.FullName "OpenWrtManager-${v}-win7-${a}-setup.exe"}
          Get-ChildItem "*.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win-legacy-${{ matrix.arch }}
          path: desktop/dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error

  # ── Linux（deb + rpm + AppImage）───────────────────────────
  build-linux:
    name: Linux — ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: ''
      - uses: actions/cache@v4
        id: c
        with:
          path: desktop/node_modules
          key: nm-linux-${{ matrix.arch }}-${{ hashFiles('desktop/package-lock.json') }}
      - if: steps.c.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      # arm64 需要交叉编译工具链
      - if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64

      - working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - working-directory: desktop
        run: |
          ARCH=${{ matrix.arch }}
          if [ "$ARCH" = "arm64" ]; then
            npx electron-builder --linux deb rpm AppImage --arm64 --publish never
          else
            npx electron-builder --linux deb rpm AppImage pacman --x64 --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Linux artifacts
        run: |
          V="${{ env.APP_VERSION }}"
          A="${{ matrix.arch }}"
          cd desktop/dist-electron
          for f in *.deb;      do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-${A}.deb"; done
          for f in *.rpm;      do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-${A}.rpm"; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-${A}.AppImage"; done
          for f in *.pacman;   do [ -f "$f" ] && mv "$f" "OpenWrtManager-${V}-linux-${A}.pacman"; done
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.rpm
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.pacman
          retention-days: 7
          if-no-files-found: warn

  # ── Release ─────────────────────────────────────────────────
  release:
    needs: [build-win-modern, build-win-legacy, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{win-*,linux-*}'
          merge-multiple: true
          path: files
      - run: ls -lh files/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenWrt Manager ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body: |
            ## 下载

            ### Windows
            | 文件 | 系统 | 架构 |
            |------|------|------|
            | `*-win10-x64-setup.exe` | Windows 10/11 | 64位 ✅ 推荐 |
            | `*-win10-x64-portable.exe` | Windows 10/11 | 64位免安装 |
            | `*-win10-ia32-setup.exe` | Windows 10/11 | 32位 |
            | `*-win7-x64-setup.exe` | Win 7/8/8.1 | 64位 |
            | `*-win7-ia32-setup.exe` | Win 7/8/8.1 | 32位 |

            ### Linux
            | 文件 | 适用发行版 |
            |------|-----------|
            | `*-linux-x64.deb` | Ubuntu / Debian / Deepin / UKylin / 统信 UOS |
            | `*-linux-x64.rpm` | CentOS / RHEL / Fedora / 银河麒麟 / 中标麒麟 |
            | `*-linux-x64.AppImage` | 所有 Linux 发行版（免安装）|
            | `*-linux-x64.pacman` | Arch Linux / Manjaro |
            | `*-linux-arm64.deb` | ARM64 版 Ubuntu/Debian |
            | `*-linux-arm64.rpm` | ARM64 版 RHEL/Fedora |
            | `*-linux-arm64.AppImage` | ARM64 所有发行版 |

            > **国产系统说明**：Deepin/UOS/统信 选 `.deb`；银河麒麟/中标麒麟 选 `.rpm`；UKylin(优麒麟) 选 `.deb`

            ### 路由器端初始化
            ```bash
            opkg update && opkg install rpcd uhttpd-mod-ubus
            uci set uhttpd.main.ubus_cors=1 && uci commit uhttpd
            /etc/init.d/uhttpd restart
            ```
          files: files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
